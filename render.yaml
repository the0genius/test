services:
  - type: web
    name: media-inference-worker
    runtime: docker
    plan: free
    envVars:
      # Required: without it the app refuses to start on a public host.
      - key: APP_PASSWORD
        generateValue: true
      # Your own Higgsfield key. Set these in the dashboard, not here.
      - key: HF_API_KEY_ID
        sync: false
      - key: HF_API_KEY_SECRET
        sync: false
